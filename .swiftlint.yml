# Managed by swift-bedrock, for SwiftLint 0.65.1. swift-format owns layout, so
# SwiftLint checks meaning only. These rules fight swift-format output and stay off:
# trailing_comma, contrasted_opening_brace, conditional_returns_on_newline, opening_brace,
# vertical_parameter_alignment, closure_end_indentation, multiline_parameters.
# discouraged_default_parameter stays off too: the Swift API Design Guidelines
# prefer default arguments.
# No analyzer_rules: with Swift 6.4, `swiftlint analyze` can't load test modules, so it
# reports each @Test function as unused and each @testable import as unneeded.

disabled_rules:
  # Metrics and restrictions that Google Swift style does not impose or that reject permitted code.
  - closure_parameter_position
  - cyclomatic_complexity
  - force_cast
  - force_try
  - function_body_length
  - function_parameter_count
  - generic_type_name
  - identifier_name
  - large_tuple
  - nesting
  - opening_brace
  - todo
  - type_body_length
  - type_name
  - vertical_parameter_alignment
  # swift-format owns trailing commas in multiline collections.
  - trailing_comma

opt_in_rules:
  - array_init
  - async_without_await
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - incompatible_concurrency_annotation
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - local_doc_comment
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - superfluous_else
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - weak_delegate
  - yoda_condition
  - indentation_width
  - prefer_condition_list
  - redundant_final
  - redundant_self
  - unneeded_escaping
  - unneeded_throws_rethrows
  - unused_parameter
  - variable_shadowing
  # XCTest hygiene, for the UI tests that still use it.
  - balanced_xctest_lifecycle
  - final_test_case
  - test_case_accessibility
  - xct_specific_matcher

# 2-space indentation, as swift-format.
indentation_width:
  indentation_width: 2

file_length:
  warning: 500
  error: 500
  ignore_comment_only_lines: true

line_length:
  warning: 100
  error: 100
  ignores_urls: true
  excluded_lines_patterns:
    - '^\s*(?:@testable\s+)?import\b'

# Docs are required on the API other modules see: an open or public declaration
# whose enclosing types are public too. swift-format's
# AllPublicDeclarationsHaveDocumentation is off, since it also flags a public
# member of an internal type.
missing_docs:
  error: [open, public]
  excludes_extensions: true
  excludes_inherited_types: false
  evaluate_effective_access_control_level: true

trailing_whitespace:
  severity: error

vertical_whitespace:
  max_empty_lines: 1

comma:
  severity: error

colon:
  severity: error

overridden_super_call:
  severity: error

private_action:
  severity: error

private_outlet:
  severity: error

implicit_getter:
  severity: error

custom_rules:
  # Swift Testing is the test framework. XCTest is allowed only in UI test targets
  # (any path component ending in UITests), which still need XCUIApplication.
  forbid_xctest_import:
    name: "XCTest outside UI tests"
    message: "Use Swift Testing (import Testing). XCTest is allowed only in *UITests targets."
    regex: '^\s*(?:@testable\s+|@preconcurrency\s+)?import\s+XCTest\b|canImport\(\s*XCTest\s*\)'
    excluded: "(^|/)[^/]*UITests?/"
    match_kinds:
      - keyword
      - identifier
    severity: error

excluded:
  - .build
  - .swiftpm
  - "**/.build"
  - "**/Generated"
  - node_modules
  - "**/*.xcodeproj"
  - .claude
  - openspec
