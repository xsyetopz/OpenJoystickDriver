disabled_rules:
  # Non-Google metrics/restrictions or rules that reject Google-permitted code.
  - closure_parameter_position
  - cyclomatic_complexity
  - file_length
  - force_cast
  - force_try
  - function_body_length
  - function_parameter_count
  - generic_type_name
  - identifier_name
  - large_tuple
  - nesting
  - opening_brace
  - todo
  - type_body_length
  - type_name
  - vertical_parameter_alignment

  # swift-format owns multiline collection trailing commas.
  - trailing_comma

opt_in_rules:
  - array_init
  - async_without_await
  - closure_end_indentation
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - incompatible_concurrency_annotation
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - strict_fileprivate
  - superfluous_else
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - weak_delegate
  - yoda_condition

analyzer_rules:
  - capture_variable
  - unused_declaration
  - unused_import

# Google: rigid 100-column limit, except indivisible text such as URLs,
# imports, and generated code.
line_length:
  warning: 100
  error: 100
  ignores_urls: true
  excluded_lines_patterns:
    - '^\s*(?:@testable\s+)?import\b'

unused_import:
  severity: error

trailing_whitespace:
  severity: error

# Google permits multiple consecutive blank lines. Keep this as a
# repository-hygiene warning, allowing up to two.
vertical_whitespace:
  max_empty_lines: 2

comma:
  severity: error

colon:
  severity: error

overridden_super_call:
  severity: error

private_action:
  severity: error

private_outlet:
  severity: error

implicit_getter:
  severity: error

excluded:
  - .build
  - .swiftpm
  - "**/Generated"
