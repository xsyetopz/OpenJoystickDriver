name: Feature Request
description: Ask for new behavior in OpenJoystickDriver.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the current behavior on a `main` build first ([Target Branch](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#target-branch)). For a controller that does not work, use [Controller Support](https://github.com/xsyetopz/OpenJoystickDriver/issues/new?template=controller-support.yml).
        Back each claim with pasted output, a file, a link, or a screenshot.
        An AI tool may draft fields and run commands; you confirm each value. Rules: [AI Agents](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#ai-agents).
  - type: markdown
    attributes:
      value: "## Request"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App window
        - Menu-bar item
        - Command line (ojd)
        - Profiles (change what a button does)
        - Controller support
        - Games (how a game sees the controller)
        - Documentation
        - Building and tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do and what stops you today, as one real case.
      placeholder: I want to swap the two sticks for one game. I cannot find a setting for it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Behavior
      description: What you would click or type, and what you would see.
      placeholder: I open a profile and click Swap Sticks. The game reads the left stick as the right stick.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current Workaround
      description: What you do now instead. Write `None` if nothing works.
      placeholder: I swap the sticks in the game, which has no such setting for the second player.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## Evidence"
  - type: input
    id: version
    attributes:
      label: OpenJoystickDriver Version
      description: The whole line from **About OpenJoystickDriver** or `ojd --version`; it contains `+build.`. [Finding the Version](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#finding-the-version).
      placeholder: 0.6.0-alpha.1+build.1.8.74.sha.08bc747d93f6.dirty (1.8.74)
    validations:
      required: true
  - type: textarea
    id: current-evidence
    attributes:
      label: Current Behavior
      description: Command output (such as `ojd profile --help`), a screenshot, or the wiki text or source line that shows the limit, with its link.
      render: text
      placeholder: |
        $ ojd profile --help
        <paste the output>
    validations:
      required: true
  - type: textarea
    id: unrun
    attributes:
      label: Commands Not Run
      description: Write `None`, or for each command that could not run, the exact failed step, the exact error or reason, and what you tried instead with its output.
      placeholder: |
        None
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Additional Context
      description: Links, screenshots, how other tools solve it, and the files the change would touch.
  - type: markdown
    attributes:
      value: |
        ## AI Assistance
        Skip this section if no AI tool helped.
  - type: input
    id: ai-tool
    attributes:
      label: Assisted-by
      description: "`AGENT_NAME:MODEL_VERSION`, as in the `Assisted-by:` tag."
      placeholder: Claude Code:claude-opus-5-5
  - type: textarea
    id: ai-work
    attributes:
      label: AI Work Log
      description: The fields the AI tool wrote, each command it ran with its output, and each claim you checked by hand with how.
      render: text
  - type: textarea
    id: maintainer-prompt
    attributes:
      label: Tested Change
      description: Only for a change you ran yourself. Numbered steps another AI tool can follow without guessing.
      render: text
      placeholder: |
        Feature: <what is new, for which area>.
        Tested by @<username> on OpenJoystickDriver <whole About line>, macOS <version and build>.

        1. In <path>, in <function or type>, replace <exact old code> with <exact new code>.
        2. Run <command>. Expect <result>.
        3. Change nothing else.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/xsyetopz/OpenJoystickDriver/issues?q=is%3Aissue), and this issue asks for one new feature.
          required: true
        - label: Each claim has output, a file, a link, or a screenshot behind it.
          required: true
        - label: I read this whole issue and stand behind it, including any part an AI tool wrote.
          required: true
