name: Controller Support (AI Agent)
description: OpenJoystickDriver does not detect a controller, or drives it wrong. Written by an AI agent for a human operator.
title: "[Controller]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for an AI agent. A human operator reads the issue and stands behind it before it is submitted. Rules: [CONTRIBUTING.md](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#ai-agents).

        - Write short, plain sentences in the words a user would use. Do not use jargon to sound exact.
        - Fill the fields and nothing else: no preamble, recap, extra headings, or emoji.
        - Write exact values. Write `Not checked` for anything nobody checked. Do not guess.
        - Check the problem against the newest `feat/<version>` branch. Do not open an issue about `main` or an earlier `feat/` branch while a later one exists: [Target Branch](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#target-branch).
  - type: input
    id: agent
    attributes:
      label: Agent, model, and harness
      description: The exact model ID, and the harness with its version.
      placeholder: claude-opus-5-5 in Claude Code 2.1.300
    validations:
      required: true
  - type: input
    id: operator
    attributes:
      label: Human operator
      description: The GitHub username of the person who ran the commands and read this issue.
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenJoystickDriver version
      description: >-
        The whole line from **About OpenJoystickDriver** of the build that was tested. Get it on the operator's Mac
        with the AppleScript or `ojd --version` in [Finding the Version](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#finding-the-version).
        A line without `+build.` is not the whole line.
      placeholder: 0.6.0-alpha.1+build.1.8.74.sha.08bc747d93f6.dirty (1.8.74)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the build came from
      options:
        - GitHub release
        - Tester build DMG (attach OpenJoystickDriver-TESTER-BUILD.txt below)
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and build
      description: Run `sw_vers` in Terminal. Copy `ProductVersion` and `BuildVersion`.
      placeholder: 15.6.1 (24G90)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      description: Apple menu > **About This Mac**.
      placeholder: MacBook Air, Apple M2, 2022
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller name and maker
      description: The name on the controller or its box.
      placeholder: 8BitDo Ultimate 2C Wired Controller
    validations:
      required: true
  - type: input
    id: vid-pid
    attributes:
      label: VID:PID
      description: From `ojd controller list`, **System Information > USB**, or `system_profiler SPUSBDataType`.
      placeholder: 045e:028e
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB cable
        - Bluetooth
        - Wireless dongle (name it in Controller name and maker)
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Mode
      description: The mode switch position or button combination you used, and what the controller says it acts as. Write `None` if it has no modes.
      placeholder: Switch on X; acts as an Xbox 360 controller
    validations:
      required: true
  - type: textarea
    id: system-profiler
    attributes:
      label: System Information entry
      description: Run `system_profiler SPUSBDataType` (USB and dongles) or `system_profiler SPBluetoothDataType` (Bluetooth). Paste only this controller's block.
      render: text
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: What works
      description: List each control (buttons, sticks, triggers, rumble, lights, touchpad, motion). Mark each `Works`, `Wrong` (say how), `Not working`, or `Not tested`.
      placeholder: |
        - Buttons: Works
        - Left stick: Wrong, up and down are swapped
        - Rumble: Not working
        - Lights: Not tested
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Support report and packet capture
      description: >-
        Attach `support-report.json` from `ojd diagnose --output support-report.json`. If OJD detects the controller,
        attach `ojd controller capture <controller> --duration 10 --json > capture.jsonl` and list the controls you pressed in order.
        Read each file before you attach it. If you leave a file out, say which and why.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other details
      description: Other operating systems or drivers where the controller works, and in which mode.
  - type: dropdown
    id: change-status
    attributes:
      label: Tested change
      options:
        - No change
        - Change written, not tested on hardware
        - Change tested by the human operator on their hardware
    validations:
      required: true
  - type: textarea
    id: change-test
    attributes:
      label: How the operator tested the change
      description: The commands they ran, the controller and connection they used, and what they saw. Write `No tested change` if there is none.
    validations:
      required: true
  - type: textarea
    id: maintainer-prompt
    attributes:
      label: Prompt for the maintainer's agent
      description: >-
        Required when the operator tested a change. Numbered steps that another agent follows without guessing:
        each file to change, the exact change, each check to run, and the result to expect.
        Write `No tested change` if there is none.
      render: text
      placeholder: |
        Fix: <one sentence: what is wrong and for which controller, VID:PID, and connection>.
        Tested by @<operator> on OpenJoystickDriver <whole About line>, macOS <version and build>.

        1. In <path>, in <function or type>, replace <exact old code> with <exact new code>.
        2. Run <command>. Expect <result>.
        3. Change nothing else.
    validations:
      required: true
  - type: checkboxes
    id: agent-confirm
    attributes:
      label: Operator confirmation
      options:
        - label: The human operator read this whole issue before submitting it.
          required: true
        - label: Every value and output in this issue comes from a command that ran on the operator's Mac with this controller connected.
          required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched [existing issues](https://github.com/xsyetopz/OpenJoystickDriver/issues?q=is%3Aissue) and found no report of this.
          required: true
        - label: I read [Supported controllers](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Supported-Controllers).
          required: true
        - label: This issue covers one controller.
          required: true
