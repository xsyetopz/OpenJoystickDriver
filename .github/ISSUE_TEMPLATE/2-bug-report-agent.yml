name: Bug Report (AI Agent)
description: Something in OpenJoystickDriver does not work as documented. Written by an AI agent for a human operator.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for an AI agent. A human operator reads the issue and stands behind it before it is submitted. Rules: [CONTRIBUTING.md](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#ai-agents).

        - Write short, plain sentences in the words a user would use. Do not use jargon to sound exact.
        - Fill the fields and nothing else: no preamble, recap, extra headings, or emoji.
        - Write exact values. Write `Not checked` for anything nobody checked. Do not guess.
        - Check the problem against `main`: [Target Branch](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#target-branch).
  - type: input
    id: agent
    attributes:
      label: Agent, model, and harness
      description: The exact model ID, and the harness with its version.
      placeholder: claude-opus-5-5 in Claude Code 2.1.300
    validations:
      required: true
  - type: input
    id: operator
    attributes:
      label: Human operator
      description: The GitHub username of the person who ran the commands and read this issue.
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenJoystickDriver version
      description: >-
        The whole line from **About OpenJoystickDriver** of the build that was tested. Get it on the operator's Mac
        with the AppleScript or `ojd --version` in [Finding the Version](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#finding-the-version).
        A line without `+build.` is not the whole line.
      placeholder: 0.6.0-alpha.1+build.1.8.74.sha.08bc747d93f6.dirty (1.8.74)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the build came from
      options:
        - GitHub release
        - Tester build DMG (attach OpenJoystickDriver-TESTER-BUILD.txt below)
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and build
      description: Run `sw_vers` in Terminal. Copy `ProductVersion` and `BuildVersion`.
      placeholder: 15.6.1 (24G90)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      description: Apple menu > **About This Mac**.
      placeholder: MacBook Air, Apple M2, 2022
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller and VID:PID
      description: The model name and the VID:PID from `ojd controller list` or **System Information > USB**. Write `None` if no controller is involved.
      placeholder: Xbox Series X|S controller, 045e:0b12
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB cable
        - Bluetooth
        - Wireless dongle (name it in Controller and VID:PID)
        - No controller involved
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number each step. One action per step. Start from a state anyone can set up.
      placeholder: |
        1. Connect the controller with a USB cable.
        2. Open OpenJoystickDriver and click Overview.
        3. Press the A button.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What you saw. Copy error text and codes exactly. Say what happened, not what you think caused it.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Some of the time (write how many tries out of how many in Actual result)
        - Once
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Support report and logs
      description: >-
        Attach `support-report.json` from `ojd diagnose --output support-report.json`.
        For a crash or an error, add `ojd log show --lines 200`. For wrong or missing input, add a packet capture
        and the controls you pressed in order. [How to get each file](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Reporting-a-Bug).
        Read each file before you attach it. If you leave a file out, say which and why.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other details
      description: Anything else you checked, such as a build where the bug did not happen.
  - type: dropdown
    id: change-status
    attributes:
      label: Tested change
      options:
        - No change
        - Change written, not tested on hardware
        - Change tested by the human operator on their hardware
    validations:
      required: true
  - type: textarea
    id: change-test
    attributes:
      label: How the operator tested the change
      description: The commands they ran, the controller and connection they used, and what they saw. Write `No tested change` if there is none.
    validations:
      required: true
  - type: textarea
    id: maintainer-prompt
    attributes:
      label: Prompt for the maintainer's agent
      description: >-
        Required when the operator tested a change. Numbered steps that another agent follows without guessing:
        each file to change, the exact change, each check to run, and the result to expect.
        Write `No tested change` if there is none.
      render: text
      placeholder: |
        Fix: <one sentence: what is wrong and for which controller, VID:PID, and connection>.
        Tested by @<operator> on OpenJoystickDriver <whole About line>, macOS <version and build>.

        1. In <path>, in <function or type>, replace <exact old code> with <exact new code>.
        2. Run <command>. Expect <result>.
        3. Change nothing else.
    validations:
      required: true
  - type: checkboxes
    id: agent-confirm
    attributes:
      label: Operator confirmation
      options:
        - label: The human operator read this whole issue before submitting it.
          required: true
        - label: Every value and output in this issue comes from a command that ran on the operator's Mac.
          required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched [existing issues](https://github.com/xsyetopz/OpenJoystickDriver/issues?q=is%3Aissue) and found no report of this.
          required: true
        - label: I read [Known issues](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Known-Issues).
          required: true
        - label: This issue reports one bug.
          required: true
