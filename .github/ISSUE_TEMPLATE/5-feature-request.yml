name: Feature Request
description: Ask for new behavior in OpenJoystickDriver.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Fill every field with exact values. Write `None` or `Not checked` instead of leaving a field vague.
        `alpha`, `beta`, `latest`, `recent`, `some controllers`, and `doesn't work` are not answers.
        An AI agent writing this issue uses the **(AI Agent)** form instead.
        Check the problem against the newest `feat/<version>` branch. Do not open an issue about `main` or an earlier `feat/` branch while a later one exists: [Target Branch](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#target-branch).
  - type: input
    id: version
    attributes:
      label: OpenJoystickDriver version
      description: >-
        Click the menu-bar item, choose **About OpenJoystickDriver**, and copy the text after **Version**.
        [Other ways](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#finding-the-version). `alpha`, `beta`, or `latest` is not a version.
      placeholder: 0.6.0-alpha.1+build.1.8.74.sha.08bc747d93f6.dirty (1.8.74)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App window
        - Menu-bar item
        - Command line (ojd)
        - Remapping profiles
        - Controller support
        - Games and the virtual gamepad
        - Documentation
        - Building and tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today. Describe one real case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen. Say what you would click or type, and what you would see.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: What you do now instead. Write `None` if nothing works.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other details
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched [existing issues](https://github.com/xsyetopz/OpenJoystickDriver/issues?q=is%3Aissue) and found no report of this.
          required: true
        - label: This issue asks for one feature.
          required: true
