name: Controller Support
description: OpenJoystickDriver does not detect a controller, or does not work correctly with it.
title: "[Controller]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Test on a `main` build first ([Target Branch](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#target-branch)).
        The maintainer owns few of the controllers people report, so this issue is the only source of their data. Open it once each required field holds real output from your Mac. Back each claim with pasted output, a file, a log excerpt, or a screenshot.
        An AI tool may draft fields, run commands, and gather intelligence; you confirm each value. Rules: [AI Agents](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#ai-agents).

        **Test every feature the controller has.** If it vibrates, has lights, motion sensors, a touchpad, a speaker, or extra buttons, each one needs output from your own run. The maintainer closes the issue without review when a field says "pending", "untested", "TODO", or "later", or when the issue says the controller lacks a feature that the maker's feature list names.
  - type: markdown
    attributes:
      value: "## Controller"
  - type: input
    id: controller
    attributes:
      label: Controller Name and Maker
      description: The name on the controller or its box. For a receiver, add the receiver's name.
      placeholder: 8BitDo Ultimate 2C Wired Controller
    validations:
      required: true
  - type: input
    id: vid-pid
    attributes:
      label: VID:PID
      description: From `ojd controller list`, **System Information > USB**, or `system_profiler SPUSBDataType`.
      placeholder: 045e:028e
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB cable
        - Bluetooth
        - USB receiver (wireless dongle)
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Mode
      description: The switch position or button combination you used, and what the controller acts as. Write `None` if it has no modes.
      placeholder: Switch on X; acts as an Xbox 360 controller
    validations:
      required: true
  - type: textarea
    id: all-modes
    attributes:
      label: Every Mode and Connection
      description: |
        Read the maker's manual for every mode, switch position, and button combination, and try each over each connection: cable, Bluetooth, and receiver. One row per try, with the VID:PID from `ojd controller list`.
      render: markdown
      placeholder: |
        Manual: <link>

        | Connection | How to Enter the Mode | VID:PID | What OpenJoystickDriver Did |
        | --- | --- | --- | --- |
        | Bluetooth LE | Switch to BT, then pair in System Settings | 2dc8:301b | Every control works |
        | Receiver | Switch to 2.4G | 2dc8:301c | Listed, no input |
        | USB cable | Hold B while you switch the pad on (DInput) | 2dc8:301d | Not listed |
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware Version
      description: From the maker's app, such as 8BitDo Ultimate Software or GameSir Nexus, named with it. Write `No maker app` if there is none.
      placeholder: 6.6.4, read in GameSir Nexus on Windows
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Problem
      description: What works, what fails, and what should happen instead.
      placeholder: The controller is listed, but no button changes state. It should send input like other Xbox controllers.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Features
        Answer from the maker's feature list, the box, or the manual, and from what the controller does on another system. A "No" that the maker's list contradicts closes the issue.
  - type: input
    id: feature-source
    attributes:
      label: Maker's Feature List
      description: A link to the maker's product page or manual that lists the controller's features, or a photo of the box attached here.
      placeholder: https://www.8bitdo.com/ultimate-2c-wireless-controller/
    validations:
      required: true
  - type: dropdown
    id: has-rumble
    attributes:
      label: Does It Vibrate in the Grips?
      description: Motors in the handles that shake the controller in games.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: has-trigger-rumble
    attributes:
      label: Do the Triggers Vibrate on Their Own?
      description: Separate motors behind the triggers, as on Xbox One and Xbox Series controllers.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: has-lights
    attributes:
      label: Does It Have Lights a Game or Computer Can Change?
      description: Player number lights, a colored light bar or ring, or a light that changes with the mode. A light that only shows power or charging doesn't count; name it in the Lights field.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: has-motion
    attributes:
      label: Does It Sense Motion?
      description: A gyroscope or accelerometer, which games use for aiming by tilting the controller.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: has-touch
    attributes:
      label: Does It Have a Touchpad or Touch Surface?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: has-audio
    attributes:
      label: Does It Have a Speaker, Microphone, or Headphone Jack?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: has-extra-buttons
    attributes:
      label: Does It Have Buttons Beyond an Xbox Controller's?
      description: Rear paddles, M, C, or Z buttons, a share, screenshot, mute, or turbo button, or a second home button.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: has-battery
    attributes:
      label: Does It Run on a Battery?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## Environment"
  - type: input
    id: version
    attributes:
      label: OpenJoystickDriver Version
      description: The whole line from **About OpenJoystickDriver** or `ojd --version`; it contains `+build.`. [Finding the Version](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#finding-the-version).
      placeholder: 0.6.0-alpha.1+build.1.8.74.sha.08bc747d93f6.dirty (1.8.74)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Build Source
      options:
        - GitHub release
        - Tester build DMG (attach OpenJoystickDriver-TESTER-BUILD.txt)
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version
      description: "`ProductVersion` and `BuildVersion` from `sw_vers`."
      placeholder: 15.6.1 (24G90)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac Model
      description: From **About This Mac**.
      placeholder: MacBook Air, Apple M2, 2022
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Evidence
        Run each command with the controller connected, and press each control while it runs.
  - type: textarea
    id: status-output
    attributes:
      label: Status Output
      description: The whole output of `ojd status`.
      render: text
      placeholder: |
        $ ojd status
        <paste the whole output>
    validations:
      required: true
  - type: textarea
    id: system-profiler
    attributes:
      label: System Information Entry
      description: This controller's block from `system_profiler SPUSBDataType` (cable or receiver) or `system_profiler SPBluetoothDataType` (Bluetooth).
      render: text
      placeholder: |
        $ system_profiler SPUSBDataType
        <paste this controller's block>
    validations:
      required: true
  - type: textarea
    id: controller-show
    attributes:
      label: Controller Details
      description: "`ojd controller list`, then `ojd controller show <controller>`. If the controller is not listed, `ojd controller list` and `ojd diagnose`."
      render: text
      placeholder: |
        $ ojd controller list
        <paste the output>
        $ ojd controller show 045e:028e
        <paste the output>
    validations:
      required: true
  - type: textarea
    id: input-evidence
    attributes:
      label: Input
      description: "`ojd controller watch <controller> --duration 30` while you press every control in order: each button, including every extra button, the D-pad, both sticks in all four directions and pressed in, and both triggers. Name the controls you pressed, and any that did nothing."
      render: text
      placeholder: |
        $ ojd controller watch 045e:028e --duration 30
        <paste the output>
        Pressed: A, B, X, Y, LB, RB, LT, RT, View, Menu, Home, Share, P1, P2, D-pad, LS and RS in four directions and pressed in.
        Did nothing: P1, P2.
    validations:
      required: true
  - type: textarea
    id: rumble-evidence
    attributes:
      label: Rumble
      description: |
        For a controller that vibrates, run each motor on its own and say what you felt from each. For one that doesn't, write `No motors`.
        - `ojd controller rumble <controller> --left 255 --duration 2`
        - `ojd controller rumble <controller> --right 255 --duration 2`
        - With trigger motors: `--left-trigger 255` and `--right-trigger 255`, each alone.
      render: text
      placeholder: |
        $ ojd controller rumble 045e:028e --left 255 --duration 2
        <paste the output>
        Left grip: strong.
        $ ojd controller rumble 045e:028e --right 255 --duration 2
        <paste the output>
        Right grip: nothing.
    validations:
      required: true
  - type: textarea
    id: light-evidence
    attributes:
      label: Lights
      description: |
        For each light, run the command that drives it and say what you saw. Name any power or charging light too. For a controller with no light, write `No lights`.
        - Player number lights: `ojd controller player <controller> 1`, then `2`, `3`, `4`, and `off`.
        - Color light: `ojd controller light <controller> --color FF0000`, then `00FF00` and `0000FF`, then `--brightness 0`.
      render: text
      placeholder: |
        $ ojd controller player 045e:028e 2
        <paste the output>
        Second player light on.
        $ ojd controller light 045e:028e --color FF0000
        <paste the output>
        The light bar stayed blue.
    validations:
      required: true
  - type: textarea
    id: motion-touch-evidence
    attributes:
      label: Motion and Touch
      description: |
        For a controller that senses motion, `ojd controller capture <controller> --duration 10 --json > motion.jsonl` while you keep it still for 3 seconds, then tilt it forward, back, left, and right. For a touchpad, `--json > touch.jsonl` while you drag one finger left to right, then top to bottom, then press the pad. Attach each file and say what you did when. Write `No motion sensor` or `No touchpad` for what it lacks.
      placeholder: |
        motion.jsonl attached: still 0–3 s, forward 3–5 s, back 5–7 s, left 7–8 s, right 8–10 s.
        No touchpad.
    validations:
      required: true
  - type: textarea
    id: audio-battery-evidence
    attributes:
      label: Speaker and Battery
      description: |
        For a speaker or headphone jack, `ojd controller speaker play <controller> <sound file>`, once more with headphones in the jack, and what you heard where. Paste the output even when the command fails. For a battery, the battery line of `ojd controller show <controller>` and the level the maker's app or another system shows. Write `No speaker or jack` or `No battery` for what it lacks.
      render: text
      placeholder: |
        $ ojd controller speaker play 054c:09cc chime.wav
        <paste the output>
        Speaker: nothing. Headphones: nothing.
        $ ojd controller show 054c:09cc
        Battery: 70-79%, charging
        Steam on Windows shows 75%.
    validations:
      required: true
  - type: textarea
    id: virtual-evidence
    attributes:
      label: Virtual Gamepad
      description: "`ojd virtual show <controller>`, then `just diagnose-browsers` in a clone of this repository or a screenshot of a game you own."
      render: text
      placeholder: |
        $ ojd virtual show 045e:028e
        <paste the output>
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Support Report and Capture
      description: Attach `support-report.json` from `ojd diagnose --output support-report.json` and `capture.jsonl` from `ojd controller capture <controller> --duration 10 --json > capture.jsonl`, after you read both. Paste `wc -l capture.jsonl`.
      placeholder: |
        support-report.json and capture.jsonl attached.
        $ wc -l capture.jsonl
        <paste the output>
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Intelligence
        Data from other systems and projects often holds the fix. [Gather Data From Other Systems](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Reporting-a-Bug#gather-data-from-other-systems).
  - type: textarea
    id: macos-descriptors
    attributes:
      label: macOS Descriptors
      description: Attach `ioreg -r -c IOHIDDevice -l -w0 > ioreg-hid.txt` and `ioreg -p IOUSB -l -w0 > ioreg-usb.txt`, and paste this controller's `ReportDescriptor` line. For a HID controller, also attach `ojd record draft <controller> > draft.plist`, made while you press each control.
      placeholder: |
        ioreg-hid.txt, ioreg-usb.txt and draft.plist attached.
        "ReportDescriptor" = <05010905a101...>
    validations:
      required: true
  - type: textarea
    id: other-systems
    attributes:
      label: Windows or Linux Data
      description: |
        From a Windows PC, Linux PC, Steam Deck, or Raspberry Pi, with what works there, the driver or app that serves it, and the mode. Write `No Windows or Linux computer` if you have neither.
        - Linux: `sudo lsusb -v -d VVVV:PPPP`, a `hid-recorder` recording, a usbmon capture from before the plug-in, and `sudo dmesg | tail -50`.
        - Windows: **Hardware Ids** from Device Manager, a USB Device Tree Viewer dump, and a USBPcap capture from before the plug-in.
      placeholder: |
        Linux 6.12, Steam Deck: xpad binds, every control works.
        lsusb.txt, plug-in.pcapng and dmesg.txt attached.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Prior Findings
      description: |
        Each source that names this controller or its VID:PID, linked to the line that matters: Linux drivers (`xpad.c`, `hid-*.c`), SDL (`controller_list.h`, SDL_GameControllerDB), Steam Input, other driver projects, issues, forum threads, and the maker's manual. Name each place you searched with its search words, including searches that found nothing.
      placeholder: |
        - xpad.c lists 3537:1010 as "GameSir G7 SE": <link to the line>
        - SDL_GameControllerDB: no 3537:1082 line; searched "3537" and "1082".
        - Reddit: firmware 6.6.4 changed the PID: <link>
    validations:
      required: true
  - type: textarea
    id: unrun
    attributes:
      label: Commands Not Run
      description: Write `None`, or for each command that could not run, the exact failed step, the exact error or reason, and what you tried instead with its output.
      placeholder: |
        None
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Additional Context
      description: Anything else you found, with the output, file, or link behind it.
  - type: markdown
    attributes:
      value: |
        ## AI Assistance
        Skip this section if no AI tool helped.
  - type: input
    id: ai-tool
    attributes:
      label: Assisted-by
      description: "`AGENT_NAME:MODEL_VERSION`, as in the `Assisted-by:` tag."
      placeholder: Claude Code:claude-opus-5-5
  - type: textarea
    id: ai-work
    attributes:
      label: AI Work Log
      description: The fields the AI tool wrote, each command it ran with its output, and each claim you checked by hand with how.
      render: text
  - type: textarea
    id: maintainer-prompt
    attributes:
      label: Tested Fix
      description: Only for a change you ran on your own controller. Numbered steps another AI tool can follow without guessing.
      render: text
      placeholder: |
        Fix: <what is wrong, for which controller, VID:PID, and connection>.
        Tested by @<username> on OpenJoystickDriver <whole About line>, macOS <version and build>.

        1. In <path>, in <function or type>, replace <exact old code> with <exact new code>.
        2. Run <command>. Expect <result>.
        3. Change nothing else.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/xsyetopz/OpenJoystickDriver/issues?q=is%3Aissue) and [Supported Controllers](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Supported-Controllers), and this issue covers one controller.
          required: true
        - label: I tried every mode and connection the maker lists, and each has a row with its VID:PID.
          required: true
        - label: I tested every feature the maker lists for this controller, and each one has output from my own run. No field says pending, untested, TODO, or later.
          required: true
        - label: Each value comes from my own Mac with this controller connected, and each claim has output, a file, a log excerpt, or a screenshot behind it.
          required: true
        - label: I read this whole issue and stand behind it, including any part an AI tool wrote.
          required: true
