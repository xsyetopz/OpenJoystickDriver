name: Controller Validation
description: Every control of a controller responded in a Guided Check. Tell the maintainers it works.
title: "[Validated]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only after `ojd controller check <controller>` or **Guided Check** in Input Test ended with every control responded. For any other result, use [Controller Support](https://github.com/xsyetopz/OpenJoystickDriver/issues/new?template=controller-support.yml).
        OpenJoystickDriver fills the fields from the check and shows you the whole text first. It holds no serial number, unit ID, Bluetooth address, user name, or path. Read each field before you submit.
  - type: input
    id: controller
    attributes:
      label: Controller Name and Maker
      description: The name on the controller or its box.
      placeholder: 8BitDo Ultimate 2C Wired Controller
    validations:
      required: true
  - type: input
    id: vid-pid
    attributes:
      label: VID:PID
      placeholder: 045e:028e
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB cable
        - Bluetooth
        - USB receiver (wireless dongle)
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Mode
      description: The mode `id` of the controller record. Write `None` if the controller has no mode.
      placeholder: xinput
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Record Source
      description: Where the controller record came from.
      placeholder: Bundled
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenJoystickDriver Version
      description: The whole line from **About OpenJoystickDriver** or `ojd --version`.
      placeholder: 0.6.0-alpha.1+build.1.8.74.sha.08bc747d93f6.dirty (1.8.74)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version
      placeholder: 15.6.1
    validations:
      required: true
  - type: input
    id: controls
    attributes:
      label: Controls Responded
      placeholder: 14 of 14
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation Text
      description: The text that Guided Check or `ojd controller check --validate` showed you.
      render: text
      placeholder: |
        VID:PID: 045e:028e
        <paste the whole text>
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: Rumble, Lights, and Other Features
      description: |
        Guided Check covers controls only. Link the maker's feature list, then for each feature on it paste the output of its command and what the controller did: `ojd controller rumble` with each motor alone (`--left`, `--right`, `--left-trigger`, `--right-trigger`), `ojd controller player` and `ojd controller light`, `ojd controller capture --json` while you tilt it or touch the touchpad, `ojd controller speaker play`, and the battery line of `ojd controller show`. Write `Has none` beside each feature it lacks. A field that says pending or untested closes the issue.
      render: text
      placeholder: |
        Feature list: <link>
        $ ojd controller rumble 045e:028e --left 255 --duration 2
        <paste the output>
        Left grip: strong.
        Lights: Has none.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I ran the check on my own Mac with this controller connected.
          required: true
        - label: I read the validation text, and it holds nothing I want to keep private.
          required: true
