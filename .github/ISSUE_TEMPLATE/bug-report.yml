name: Bug Report
description: Something in OpenJoystickDriver does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Fill each field with exact values.
        Test the problem on the `main` branch first. See [Target Branch](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#target-branch).

        **You fill Part 1.** Only you hold your Mac, your controller, and what you saw. An AI tool must not fill Part 1 for you.

        **An AI tool can draft Part 2.** Read each draft. Correct it. Part 2 needs real output from your Mac.

        **Part 3 records the AI tool.** Skip Part 3 if you used no AI tool.

        **Evidence comes first.** Each claim needs pasted command output, a file, a log excerpt, or a screenshot. The form does not accept "not verified", "unsure", or "not checked". Run the command first. If you cannot run a command, use the field "Commands you could not run".

        Rules: [AI Agents](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#ai-agents).
  - type: markdown
    attributes:
      value: |
        ## Part 1: Your Mac, your controller, and what you saw (you fill these)
  - type: input
    id: version
    attributes:
      label: OpenJoystickDriver version
      description: |-
        Click the menu-bar item. Choose **About OpenJoystickDriver**. Copy the text after **Version**. Or run `ojd --version`.
        [Other ways to get it](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#finding-the-version).
        Copy the whole line. A line without `+build.` is not the whole line.
      placeholder: |
        0.6.0-alpha.1+build.1.8.74.sha.08bc747d93f6.dirty (1.8.74)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the build came from
      options:
        - GitHub release
        - Tester build DMG (attach OpenJoystickDriver-TESTER-BUILD.txt below)
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and build
      description: |-
        Run `sw_vers` in Terminal. Copy `ProductVersion` and `BuildVersion`.
      placeholder: |
        15.6.1 (24G90)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      description: |-
        Open the Apple menu. Choose **About This Mac**.
      placeholder: |
        MacBook Air, Apple M2, 2022
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller name and VID:PID
      description: |-
        Write the model name. Add the VID:PID. The VID:PID is two hexadecimal numbers that identify the controller model.
        Get it from `ojd controller list` or from **System Information > USB**. Write `None` if no controller is involved.
      placeholder: |
        Xbox Series X|S controller, 045e:0b12
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB cable
        - Bluetooth
        - USB receiver (a wireless dongle; write its name in the field above)
        - No controller involved
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you saw
      description: |-
        Say what happened. Copy error text and codes exactly. Do not write what you think caused it.
      placeholder: |
        I pressed A. The Controllers area showed no input.
        The error text was: <copy it exactly>.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often it happens
      options:
        - Every time
        - Some of the time (write how many tries out of how many in What you saw)
        - Once
    validations:
      required: true
  - type: textarea
    id: status-output
    attributes:
      label: Output of ojd status
      description: |-
        Run `ojd status`. Paste the whole output. It shows the service, the extension, the permissions, and the connected controllers.
      render: text
      placeholder: |
        $ ojd status
        <paste the whole output>
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Part 2: Steps and evidence (an AI tool can draft these; you confirm them)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |-
        Number each step. Write one action in each step. Start from a state that anyone can set up.
      placeholder: |
        1. Connect the controller with a USB cable.
        2. Open OpenJoystickDriver and click Controllers.
        3. Press the A button.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: |-
        Say what should happen.
      placeholder: |
        The Controllers area shows the A button as pressed.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area of the bug
      options:
        - Input (a control does nothing or does the wrong thing)
        - Rumble
        - Lights
        - Connection (the controller is not found, or it disconnects)
        - Virtual gamepad or a game
        - App, service, or crash
        - Build or tests
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence for that area
      description: |-
        Paste the output of the command for your area. Run the command while the bug happens. Press the control that fails.

        - Input: `ojd controller watch <controller> --duration 10`. Then `ojd controller capture <controller> --duration 10 --json > capture.jsonl`. Attach the file.
        - Rumble: `ojd controller rumble <controller> --left 255 --right 255 --duration 2`. Add what you felt in each motor.
        - Lights: `ojd controller light <controller> --color FF8000`. Add the color that you saw.
        - Connection: `ojd controller list`, then `ojd controller show <controller>`.
        - Virtual gamepad or a game: `ojd virtual show <controller>`. Add a screenshot or the log of the game.
        - App, service, or crash: `ojd log show --lines 200`.
        - Build or tests: `swift --version`, then the failing output of the check that you ran, for example `just check`.

        [How to get each file](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Reporting-a-Bug).
      render: text
      placeholder: |
        $ ojd controller watch 045e:028e --duration 10
        <paste the output; the A button never changes>
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Support report
      description: |-
        Run `ojd diagnose --output support-report.json`. Attach `support-report.json`. Read the file before you attach it.
        Then paste each line of the `ojd diagnose` output that says `fail` or `warn`.
      placeholder: |
        support-report.json attached.
        ojd diagnose, 1 fail: <paste the line>
    validations:
      required: true
  - type: textarea
    id: unrun
    attributes:
      label: Commands you could not run
      description: |-
        Write `None` if you ran each command that this form asks for.
        If you could not run a command, write three things for that command.
        1. The exact step that failed, or the exact item that was missing.
        2. The exact error text, or the exact reason. For example, write the version that you found and the version that the command needs.
        3. What you tried instead, with its output.
        An answer with fewer than three things is not accepted.
      placeholder: |
        None

        Example of a good answer for a command that failed:
        `./Scripts/ojd check swift`
        1. Step: the build stopped at the environment check.
        2. Error: `swift --version` printed Swift 6.3.3. The file `.swift-version` names a newer version.
        3. Tried: I ran `swift build`. Output: <paste it>.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other details
      description: |-
        Write anything else that you checked. For example, name a build where the bug did not happen. Add the output that shows it.
  - type: markdown
    attributes:
      value: |
        ## Part 3: AI tool (optional; skip it if you used no AI tool)
  - type: input
    id: ai-tool
    attributes:
      label: AI tool and model
      description: |-
        Write the name and version of the tool. Write the exact model ID.
      placeholder: |
        Claude Code 2.1.300, claude-opus-5-5
  - type: textarea
    id: ai-output
    attributes:
      label: What the AI tool produced
      description: |-
        Name each field or file that the AI tool wrote or changed.
  - type: textarea
    id: ai-commands
    attributes:
      label: Commands the AI tool ran, with their output
      description: |-
        Paste each command with its real output. Do not shorten the output. Do not retype it.
        An AI tool must not mark an item as done without the output that shows it.
      render: text
      placeholder: |
        $ ojd controller watch 045e:028e --duration 10
        <paste the output>
  - type: textarea
    id: ai-checked
    attributes:
      label: What you checked by hand
      description: |-
        List each claim of the AI tool that you checked yourself. For each claim, write the command or the action that you used, and its output.
        Remove each claim that you did not check.
  - type: dropdown
    id: change-status
    attributes:
      label: Change that you or the AI tool wrote
      options:
        - No change
        - Change written; I ran it on my hardware and pasted the output below
        - Change written; I could not run it (fill in Commands you could not run)
  - type: textarea
    id: change-test
    attributes:
      label: How you tested the change
      description: |-
        Write each command that you ran, the controller and the connection that you used, and the output.
        You must run this test yourself.
  - type: textarea
    id: maintainer-prompt
    attributes:
      label: Steps for the maintainer's AI tool
      description: |-
        Fill in this field when you tested a change. Write numbered steps that another AI tool can follow without guessing.
        Name each file to change, the exact change, each check to run, and the result to expect.
      render: text
      placeholder: |
        Fix: <one sentence: what is wrong or new, for which controller, VID:PID, and connection>.
        Tested by @<your username> on OpenJoystickDriver <whole About line>, macOS <version and build>.

        1. In <path>, in <function or type>, replace <exact old code> with <exact new code>.
        2. Run <command>. Expect <result>.
        3. Change nothing else.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched [existing issues](https://github.com/xsyetopz/OpenJoystickDriver/issues?q=is%3Aissue) and found no report of this.
          required: true
        - label: I read [Known issues](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Known-Issues).
          required: true
        - label: This issue reports one bug.
          required: true
        - label: I ran each command on my own Mac. Each value about my Mac and my controller is true.
          required: true
        - label: Each claim in this issue has pasted output, a file, a log excerpt, or a screenshot that shows it.
          required: true
        - label: I read this whole issue. I stand behind it.
          required: true
        - label: If an AI tool helped, I described it in Part 3.
          required: true
