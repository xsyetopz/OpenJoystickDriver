name: Bug Report
description: Something in OpenJoystickDriver does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reproduce the bug on a `main` build first ([Target Branch](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#target-branch)).
        Open the issue once each required field holds real output from your Mac. Back each claim with pasted output, a file, a log excerpt, or a screenshot.
        An AI tool may draft fields and run commands; you confirm each value. Rules: [AI Agents](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#ai-agents).
  - type: markdown
    attributes:
      value: "## Problem"
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened. Copy error text and codes exactly.
      placeholder: |
        I pressed A. The Controllers area showed no input.
        Error: <copy it exactly>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen.
      placeholder: The Controllers area shows the A button as pressed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered, one action each, starting from a state anyone can set up.
      placeholder: |
        1. Connect the controller with a USB cable.
        2. Open OpenJoystickDriver and click Controllers.
        3. Press A.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Some of the time (write tries out of total in Actual Behavior)
        - Once
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Input (a control does nothing or the wrong thing)
        - Rumble
        - Lights
        - Connection (not found, or disconnects)
        - Virtual gamepad or a game
        - App, service, or crash
        - Build or tests
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## Environment"
  - type: input
    id: version
    attributes:
      label: OpenJoystickDriver Version
      description: The whole line from **About OpenJoystickDriver** or `ojd --version`; it contains `+build.`. [Finding the Version](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CONTRIBUTING.md#finding-the-version).
      placeholder: 0.6.0-alpha.1+build.1.8.74.sha.08bc747d93f6.dirty (1.8.74)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Build Source
      options:
        - GitHub release
        - Tester build DMG (attach OpenJoystickDriver-TESTER-BUILD.txt)
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version
      description: "`ProductVersion` and `BuildVersion` from `sw_vers`."
      placeholder: 15.6.1 (24G90)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac Model
      description: From **About This Mac**.
      placeholder: MacBook Air, Apple M2, 2022
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller and VID:PID
      description: The model name and the VID:PID from `ojd controller list`. Write `None` if no controller is involved.
      placeholder: Xbox Series X|S controller, 045e:0b12
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB cable
        - Bluetooth
        - USB receiver (wireless dongle)
        - No controller involved
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## Evidence"
  - type: textarea
    id: status-output
    attributes:
      label: Status Output
      description: The whole output of `ojd status`.
      render: text
      placeholder: |
        $ ojd status
        <paste the whole output>
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Area Output
      description: |
        Run the command for your area while the bug happens, and press the control that fails. [How to get each file](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Reporting-a-Bug).
        - Input: `ojd controller watch <controller> --duration 10`, then attach `ojd controller capture <controller> --duration 10 --json > capture.jsonl`.
        - Rumble: `ojd controller rumble <controller> --left 255 --right 255 --duration 2`, and what each motor did.
        - Lights: `ojd controller light <controller> --color FF8000`, and the color you saw.
        - Connection: `ojd controller list`, then `ojd controller show <controller>`.
        - Virtual gamepad or a game: `ojd virtual show <controller>`, and a screenshot or the game's log.
        - App, service, or crash: `ojd log show --lines 200`.
        - Build or tests: `swift --version`, then the failing output of the check, such as `just verify`.
      render: text
      placeholder: |
        $ ojd controller watch 045e:028e --duration 10
        <paste the output>
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Support Report
      description: Attach `support-report.json` from `ojd diagnose --output support-report.json` after you read it, and paste each `fail` or `warn` line.
      placeholder: |
        support-report.json attached.
        fail: <paste the line>
    validations:
      required: true
  - type: textarea
    id: unrun
    attributes:
      label: Commands Not Run
      description: Write `None`, or for each command that could not run, the exact failed step, the exact error or reason, and what you tried instead with its output.
      placeholder: |
        None
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Additional Context
      description: A build without the bug, data from Windows or Linux, and links to what others found about the controller. [Gather Data From Other Systems](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Reporting-a-Bug#gather-data-from-other-systems).
  - type: markdown
    attributes:
      value: |
        ## AI Assistance
        Skip this section if no AI tool helped.
  - type: input
    id: ai-tool
    attributes:
      label: Assisted-by
      description: "`AGENT_NAME:MODEL_VERSION`, as in the `Assisted-by:` tag."
      placeholder: Claude Code:claude-opus-5-5
  - type: textarea
    id: ai-work
    attributes:
      label: AI Work Log
      description: The fields the AI tool wrote, each command it ran with its output, and each claim you checked by hand with how.
      render: text
  - type: textarea
    id: maintainer-prompt
    attributes:
      label: Tested Fix
      description: Only for a change you ran on your own controller. Numbered steps another AI tool can follow without guessing.
      render: text
      placeholder: |
        Fix: <what is wrong, for which controller, VID:PID, and connection>.
        Tested by @<username> on OpenJoystickDriver <whole About line>, macOS <version and build>.

        1. In <path>, in <function or type>, replace <exact old code> with <exact new code>.
        2. Run <command>. Expect <result>.
        3. Change nothing else.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched [existing issues](https://github.com/xsyetopz/OpenJoystickDriver/issues?q=is%3Aissue) and [Known Issues](https://github.com/xsyetopz/OpenJoystickDriver/wiki/Known-Issues), and this issue reports one new bug.
          required: true
        - label: Each value comes from my own Mac, and each claim has output, a file, a log excerpt, or a screenshot behind it.
          required: true
        - label: I read this whole issue and stand behind it, including any part an AI tool wrote.
          required: true
