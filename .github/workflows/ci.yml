name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-swiftpm:
    name: macOS SwiftPM
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcrun --find swiftc
          swift --version
          xcodebuild -version || true

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          brew install libusb
          brew install swiftlint

      - name: Verify generated controller catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ojd catalog regenerate --check

      - name: Validate controller records
        run: |
          bash scripts/ojd validate profiles

      - name: Validate scripts
        run: ./scripts/ojd validate scripts

      - name: Test scripts
        run: ./scripts/ojd test scripts

      - name: Validate Swift structure
        run: ./scripts/ojd validate swift-structure

      - name: Lint Swift
        run: |
          bash scripts/ojd lint

      - name: Build package
        run: |
          swift build

      - name: Run tests
        run: |
          swift test
