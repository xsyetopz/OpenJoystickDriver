name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-swiftpm:
    name: macOS SwiftPM
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OJD_USE_LOCAL_SWIFTERKIT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check schemas` compares the CLI output schema with the last release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        run: |
          sw_vers
          xcrun --find swiftc
          swift --version
          xcodebuild -version || true
          swift --version | grep -F "Swift version 6.3.3"

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          for dependency in markdownlint-cli2 pkg-config pyright ruff sdl3 shellcheck swift-format swiftlint xmake; do
            brew list --versions "$dependency" >/dev/null 2>&1 || brew install "$dependency"
          done
          python3 -m venv .build/schema-validator
          .build/schema-validator/bin/python -m pip install -r Scripts/Quality/requirements.txt
          echo "$PWD/.build/schema-validator/bin" >> "$GITHUB_PATH"

      - name: Verify generated controller catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Scripts/ojd catalog regenerate --check

      - name: Check controller records
        run: |
          ./Scripts/ojd check profiles

      - name: Check Python
        run: |
          ruff format --check Scripts Tests/RepositoryScripts
          ruff check Scripts Tests/RepositoryScripts
          pyright
          python3 -m unittest discover -s Tests/RepositoryScripts

      - name: Check shell
        run: find Scripts -type f \( -name '*.sh' -o -name ojd \) -print0 | xargs -0 shellcheck --external-sources --source-path=SCRIPTDIR

      - name: Check Markdown
        run: git ls-files -z -co --exclude-standard '*.md' | xargs -0 markdownlint-cli2

      - name: Check native tools
        run: ./Scripts/ojd check tools

      - name: Check schemas
        run: ./Scripts/ojd check schemas

      - name: Test macOS 14 parser compatibility
        run: ./Scripts/ojd test parsers-macos14

      - name: Check generated DriverKit project
        run: |
          test "$OJD_USE_LOCAL_SWIFTERKIT" = "0"
          ./Scripts/ojd check driverkit

      - name: Check Swift formatting and lint
        run: |
          swift-format lint --recursive --strict Package.swift Sources Tests
          swiftlint lint --no-cache --strict
          python3 Scripts/Quality/check_swift_file_length.py
          python3 Scripts/Quality/check_localization_keys.py

      - name: Build package
        run: |
          swift build

      - name: Run tests
        run: |
          swift test --no-parallel
