name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-swiftpm:
    name: macOS SwiftPM
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      OJD_USE_LOCAL_SWIFTERKIT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          sw_vers
          xcrun --find swiftc
          swift --version
          xcodebuild -version || true

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          brew list --versions swiftlint >/dev/null 2>&1 || brew install swiftlint
          python3 -m venv .build/schema-validator
          .build/schema-validator/bin/python -m pip install -r scripts/quality/requirements.txt
          echo "$PWD/.build/schema-validator/bin" >> "$GITHUB_PATH"

      - name: Verify generated controller catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ojd catalog regenerate --check

      - name: Check controller records
        run: |
          ./scripts/ojd check profiles

      - name: Check scripts
        run: ./scripts/ojd check scripts

      - name: Check schemas
        run: ./scripts/ojd check schemas

      - name: Check Swift structure
        run: ./scripts/ojd check swift-structure

      - name: Check generated DriverKit project
        run: |
          test "$OJD_USE_LOCAL_SWIFTERKIT" != "1"
          ./scripts/ojd check driverkit

      - name: Lint Swift
        run: |
          ./scripts/ojd lint

      - name: Build package
        run: |
          swift build

      - name: Run tests
        run: |
          swift test --no-parallel
