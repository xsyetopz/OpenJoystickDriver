name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-swiftpm:
    name: macOS SwiftPM
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      OJD_USE_LOCAL_SWIFTERKIT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bundle version counts commits (`Scripts/Release/bundle_version.py`) over the full history.
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          # environment.sh selects Xcode's swift and stops unless it is the version .swift-version names.
          bash -c 'source Scripts/Platform/environment.sh && echo "$SWIFT_PATH" && "$SWIFT_PATH" --version'

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          for dependency in pkg-config ruff sdl3 shellcheck swift-format swiftlint xmake; do
            brew list --versions "$dependency" >/dev/null 2>&1 || brew install "$dependency"
          done
          python3 -m venv .build/schema-validator
          .build/schema-validator/bin/python -m pip install -r Scripts/Quality/requirements.txt
          echo "$PWD/.build/schema-validator/bin" >> "$GITHUB_PATH"

      # Each source is stored under its locked sha256 and checked on read, so a run downloads only changed sources.
      - name: Cache controller catalog sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/catalog-sources
          key: catalog-sources-${{ hashFiles('ControllerSources.lock.json') }}

      - name: Verify generated controller catalog
        run: |
          ./Scripts/ojd catalog regenerate --check
          ./Scripts/ojd errors regenerate --check
          ./Scripts/ojd vocabulary regenerate --check

      - name: Check controller records
        run: |
          ./Scripts/ojd check profiles

      - name: Check Python
        run: |
          ruff format --check Scripts Tests/RepositoryScripts
          ruff check Scripts Tests/RepositoryScripts
          .build/schema-validator/bin/python -m unittest discover -s Tests/RepositoryScripts

      - name: Check shell
        run: find Scripts -type f \( -name '*.sh' -o -name ojd \) -print0 | xargs -0 shellcheck --external-sources --source-path=SCRIPTDIR

      - name: Check native tools and the WebRTC bridge package
        run: ./Scripts/ojd check tools

      - name: Check schemas
        run: ./Scripts/ojd check schemas

      - name: Test macOS 14 parser compatibility
        run: |
          ./Scripts/ojd test parsers-macos14
          ./Scripts/ojd snapshots check

      - name: Check generated DriverKit project
        run: |
          test "$OJD_USE_LOCAL_SWIFTERKIT" = "0"
          ./Scripts/ojd check driverkit

      - name: Check Swift formatting and lint
        run: |
          swift-format lint --recursive --strict Package.swift Sources Tests Tools
          swiftlint lint --no-cache --strict
          python3 Scripts/Quality/check_localization_keys.py

      - name: Build and test package
        run: ./Scripts/ojd check swift
