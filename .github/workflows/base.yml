name: Base

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.90.6
        with:
          tool: just@1.59.0,shellcheck
      # A repo with Bun lints Markdown with its pinned markdownlint-cli2 and custom rules.
      - if: hashFiles('bun.lock') != ''
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - if: hashFiles('bun.lock') != ''
        run: bun install --frozen-lockfile && just lint-markdown
      - if: hashFiles('bun.lock') == ''
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
      - run: just guard-base lint-hooks
