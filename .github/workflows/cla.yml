name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CLA.md
          branch: cla-signatures
          allowlist: xsyetopz,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: Before this pull request can be merged, please read the [Contributor License Agreement](https://github.com/xsyetopz/OpenJoystickDriver/blob/main/CLA.md) and sign it by posting the sentence below as a comment.
