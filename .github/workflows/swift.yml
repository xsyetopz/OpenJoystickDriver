name: Swift

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    # A macOS runner with Xcode 27, which ships Swift 6.4.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: brew install just
      - run: just swift::setup
      - run: just cpp::setup
      - run: just cpp::verify
      - run: just swift::verify
