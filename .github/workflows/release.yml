name: Release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag to release, for example 0.1.0-rc.1
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  package:
    name: Notarized release app
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
      CERTIFICATE_SECRET: ${{ secrets.CERTIFICATE_SECRET }}
      KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
      OPENJOYSTICKDRIVER_GUI_DEVID_PROFILE_BASE64: ${{ secrets.OPENJOYSTICKDRIVER_GUI_DEVID_PROFILE_BASE64 }}
      OPENJOYSTICKDRIVER_DEXT_DEVID_PROFILE_BASE64: ${{ secrets.OPENJOYSTICKDRIVER_DEXT_DEVID_PROFILE_BASE64 }}
      NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
      NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
      OJD_USE_LOCAL_SWIFTERKIT: "0"
    steps:
      - name: Resolve release tag
        id: release
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: release tag must be SemVer, for example 0.1.0 or 0.1.0-rc.1"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.release.outputs.tag }}

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          brew list --versions swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Verify generated controller catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ojd catalog regenerate --check

      - name: Check records
        run: ./scripts/ojd check profiles

      - name: Check scripts
        run: ./scripts/ojd check scripts

      - name: Check Swift structure
        run: ./scripts/ojd check swift-structure

      - name: Check generated DriverKit project
        run: |
          test "$OJD_USE_LOCAL_SWIFTERKIT" != "1"
          ./scripts/ojd check driverkit

      - name: Lint Swift
        run: ./scripts/ojd lint

      - name: Run tests
        run: swift test --no-parallel

      - name: Set up release signing
        run: ./scripts/ojd signing ci-release-setup

      - name: Package release build
        run: |
          ./scripts/ojd package release "${{ steps.release.outputs.tag }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenJoystickDriver-${{ steps.release.outputs.tag }}
          path: .build/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpenJoystickDriver ${{ steps.release.outputs.tag }}
          files: .build/release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
