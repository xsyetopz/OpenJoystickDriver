name: Release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag to release, for example 0.1.0-rc.1
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  package:
    name: Notarized release app
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OJD_USE_LOCAL_SWIFTERKIT: "0"
    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG_INPUT"
          if [[ ! "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "ERROR: release tag must be MAJOR.MINOR.PATCH with optional -alpha.N, -beta.N, or -rc.N"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/tags/{0}', steps.release.outputs.tag) }}
          fetch-depth: 0
          fetch-tags: true

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          brew list --versions swiftlint >/dev/null 2>&1 || brew install swiftlint
          python3 -m venv .build/schema-validator
          .build/schema-validator/bin/python -m pip install -r scripts/quality/requirements.txt
          echo "$PWD/.build/schema-validator/bin" >> "$GITHUB_PATH"

      - name: Verify generated controller catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ojd catalog regenerate --check

      - name: Check records
        run: ./scripts/ojd check profiles

      - name: Check scripts
        run: ./scripts/ojd check scripts

      - name: Check schemas
        run: ./scripts/ojd check schemas

      - name: Check Swift structure
        run: ./scripts/ojd check swift-structure

      - name: Check generated DriverKit project
        run: |
          test "$OJD_USE_LOCAL_SWIFTERKIT" != "1"
          ./scripts/ojd check driverkit

      - name: Lint Swift
        run: ./scripts/ojd lint

      - name: Run tests
        run: swift test --no-parallel

      - name: Create release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          actual="$(git rev-parse HEAD)"
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            expected="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$expected" != "$actual" ]]; then
              echo "ERROR: tag $RELEASE_TAG points at $expected, not $actual"
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points at $actual"
            exit 0
          fi
          git tag "$RELEASE_TAG" HEAD
          git push origin "refs/tags/$RELEASE_TAG"
          echo "Created tag $RELEASE_TAG at $actual"

      - name: Set up release signing
        env:
          DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERTIFICATE_SECRET: ${{ secrets.CERTIFICATE_SECRET }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
          OPENJOYSTICKDRIVER_GUI_DEVID_PROFILE_BASE64: ${{ secrets.OPENJOYSTICKDRIVER_GUI_DEVID_PROFILE_BASE64 }}
          OPENJOYSTICKDRIVER_DEXT_DEVID_PROFILE_BASE64: ${{ secrets.OPENJOYSTICKDRIVER_DEXT_DEVID_PROFILE_BASE64 }}
        run: ./scripts/ojd signing ci-release-setup

      - name: Package release build
        env:
          OJD_ENV: release
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/ojd release package "$RELEASE_TAG"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenJoystickDriver-${{ steps.release.outputs.tag }}
          path: .build/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpenJoystickDriver ${{ steps.release.outputs.tag }}
          files: .build/release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}

      - name: Delete unpublished release tag on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "No release tag to clean up"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Published GitHub Release $RELEASE_TAG exists; leaving the tag"
            exit 0
          fi
          expected="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || true)"
          actual="$(git rev-parse HEAD 2>/dev/null || true)"
          if [[ -n "$expected" && -n "$actual" && "$expected" != "$actual" ]]; then
            echo "Tag $RELEASE_TAG points at $expected, not $actual; leaving it"
            exit 0
          fi
          git push origin ":refs/tags/$RELEASE_TAG" || true
          git tag -d "$RELEASE_TAG" || true
          echo "Removed unpublished tag $RELEASE_TAG"
