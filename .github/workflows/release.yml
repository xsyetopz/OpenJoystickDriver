name: Release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example 0.1.0-rc.1, or a tester tag such as 0.1.0-rc.1.tester.1
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  package:
    name: Notarized release app
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      OJD_USE_LOCAL_SWIFTERKIT: "0"
    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          echo "tag=$RELEASE_TAG_INPUT" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/tags/{0}', steps.release.outputs.tag) }}
          fetch-depth: 0
          fetch-tags: true

      # A tester build is a pre-release whose tag orders after the release before it and before the release it leads to.
      - name: Check release tag
        id: kind
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          kind="$(python3 -m Scripts.Release.bundle_version --tag-kind "$RELEASE_TAG")"
          if [[ "$kind" == tester ]]; then
            base="$(python3 -m Scripts.Release.bundle_version --tester-base "$RELEASE_TAG")"
            if ! git rev-parse --verify --quiet "refs/tags/$base" >/dev/null; then
              echo "ERROR: tester tag $RELEASE_TAG follows $base, which is not a tag"
              exit 1
            fi
          fi
          if [[ "$kind" == release ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove unused untrusted Homebrew taps
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi

      - name: Install dependencies
        run: |
          for dependency in pkg-config ruff sdl3 shellcheck swift-format swiftlint xmake; do
            brew list --versions "$dependency" >/dev/null 2>&1 || brew install "$dependency"
          done
          python3 -m venv .build/schema-validator
          .build/schema-validator/bin/python -m pip install -r Scripts/Quality/requirements.txt
          echo "$PWD/.build/schema-validator/bin" >> "$GITHUB_PATH"

      # Each source is stored under its locked sha256 and checked on read, so a run downloads only changed sources.
      - name: Cache controller catalog sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/catalog-sources
          key: catalog-sources-${{ hashFiles('ControllerSources.lock.json') }}

      - name: Verify generated controller catalog
        run: |
          ./Scripts/ojd catalog regenerate --check
          ./Scripts/ojd errors regenerate --check
          ./Scripts/ojd vocabulary regenerate --check

      - name: Check controller records
        run: |
          ./Scripts/ojd check profiles

      - name: Check Python
        run: |
          ruff format --check Scripts Tests/RepositoryScripts
          ruff check Scripts Tests/RepositoryScripts
          .build/schema-validator/bin/python -m unittest discover -s Tests/RepositoryScripts

      - name: Check shell
        run: find Scripts -type f \( -name '*.sh' -o -name ojd \) -print0 | xargs -0 shellcheck --external-sources --source-path=SCRIPTDIR

      - name: Check native tools and the WebRTC bridge package
        run: ./Scripts/ojd check tools

      - name: Check schemas
        run: ./Scripts/ojd check schemas

      - name: Test macOS 14 parser compatibility
        run: |
          ./Scripts/ojd test parsers-macos14
          ./Scripts/ojd snapshots check

      - name: Check generated DriverKit project
        run: |
          test "$OJD_USE_LOCAL_SWIFTERKIT" = "0"
          ./Scripts/ojd check driverkit

      - name: Check Swift formatting and lint
        run: |
          swift-format lint --recursive --strict Package.swift Sources Tests Tools
          swiftlint lint --no-cache --strict
          python3 Scripts/Quality/check_localization_keys.py

      - name: Build and test package
        run: ./Scripts/ojd check swift

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" |
            awk -v ref="refs/tags/$RELEASE_TAG" '
              $2 == ref { direct = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print (peeled != "" ? peeled : direct) }
            ')"
          if [[ -n "$remote" ]]; then
            if [[ "$remote" != "$actual" ]]; then
              echo "ERROR: tag $RELEASE_TAG points at $remote, not $actual"
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points at $actual"
            exit 0
          fi
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$actual"
          echo "Created tag $RELEASE_TAG at $actual"

      - name: Set up release signing
        env:
          DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERTIFICATE_SECRET: ${{ secrets.CERTIFICATE_SECRET }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
          OPENJOYSTICKDRIVER_GUI_DEVID_PROFILE_BASE64: ${{ secrets.OPENJOYSTICKDRIVER_GUI_DEVID_PROFILE_BASE64 }}
          OPENJOYSTICKDRIVER_DEXT_DEVID_PROFILE_BASE64: ${{ secrets.OPENJOYSTICKDRIVER_DEXT_DEVID_PROFILE_BASE64 }}
        run: ./Scripts/ojd signing ci-release-setup

      - name: Package release build
        env:
          OJD_ENV: release
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./Scripts/ojd release package "$RELEASE_TAG"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenJoystickDriver-${{ steps.release.outputs.tag }}
          path: .build/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpenJoystickDriver ${{ steps.release.outputs.tag }}
          files: .build/release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.kind.outputs.prerelease }}
